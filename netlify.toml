[build]
  command = "echo 'Static site, no build'"
  publish = "public"
  functions = "netlify/functions"

[dev]
  port = 8888

[functions]
  node_bundler = "esbuild"

# Auth
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# Admin API
[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin"
  status = 200

# Chat routes — all go through the trigger function
[[redirects]]
  from = "/api/chat/sessions"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat/session"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat/history"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat/poll"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
