<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-E-S-Team AI Assistant</title>
  <link rel="icon" type="image/webp" href="/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #1B3A8C;
      --blue-dark: #122868;
      --blue-light: #2952C4;
      --red:     #C8102E;
      --green:   #2E7D32;
      --dark:    #0F1923;
      --surface: #F4F6FB;
      --border:  #DDE2EF;
      --text:    #1A1A2E;
      --muted:   #6B7280;
      --white:   #FFFFFF;
      --shadow:  0 4px 24px rgba(27,58,140,0.12);
      --radius:  14px;
    }

    html, body { height: 100%; font-family: 'Source Sans 3', sans-serif; background: var(--surface); color: var(--text); }

    /* ── Layout ── */
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 820px; margin: 0 auto; background: var(--white); box-shadow: var(--shadow); }

    /* ── Header ── */
    .header {
      background: var(--blue);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 3px solid var(--red);
      flex-shrink: 0;
    }
    .header-logo { height: 46px; width: auto; object-fit: contain; filter: brightness(0) invert(1); }
    .header-info { flex: 1; }
    .header-title { font-family: 'Oswald', sans-serif; font-size: 1.15rem; font-weight: 600; color: var(--white); letter-spacing: 0.5px; }
    .header-sub { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-top: 1px; }
    .status-dot { width: 9px; height: 9px; background: var(--green); border-radius: 50%; box-shadow: 0 0 0 2px rgba(46,125,50,0.3); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px rgba(46,125,50,0.3)} 50%{box-shadow:0 0 0 5px rgba(46,125,50,0.1)} }

    /* ── Messages ── */
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .msg { display: flex; gap: 10px; max-width: 82%; animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600;
    }
    .msg.assistant .avatar { background: var(--blue); color: var(--white); }
    .msg.user .avatar { background: var(--red); color: var(--white); }

    .bubble {
      padding: 11px 15px; border-radius: var(--radius); font-size: 0.9rem; line-height: 1.6;
      word-break: break-word; white-space: pre-wrap;
    }
    .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
    .msg.user .bubble { background: var(--blue); color: var(--white); border-top-right-radius: 4px; }

    .bubble strong { font-weight: 600; }
    .bubble ul, .bubble ol { padding-left: 18px; margin: 4px 0; }
    .bubble li { margin: 2px 0; }

    /* ── Typing indicator ── */
    .typing { display: flex; align-items: center; gap: 5px; padding: 12px 15px; }
    .typing span { width: 7px; height: 7px; background: var(--blue-light); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* ── Welcome card ── */
    .welcome { text-align: center; padding: 32px 20px; }
    .welcome-logo { height: 72px; margin-bottom: 16px; }
    .welcome h2 { font-family: 'Oswald', sans-serif; font-size: 1.5rem; color: var(--blue); margin-bottom: 8px; }
    .welcome p { font-size: 0.9rem; color: var(--muted); max-width: 380px; margin: 0 auto 20px; line-height: 1.6; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .suggestion-btn {
      padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--blue);
      background: transparent; color: var(--blue); font-size: 0.82rem; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .suggestion-btn:hover { background: var(--blue); color: var(--white); }

    /* ── Input area ── */
    .input-area {
      padding: 14px 16px; border-top: 1px solid var(--border); background: var(--white);
      display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    .input-wrap { flex: 1; position: relative; }
    textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;
      font-family: inherit; font-size: 0.9rem; resize: none; line-height: 1.5;
      max-height: 120px; min-height: 42px; outline: none; transition: border 0.2s; color: var(--text);
      background: var(--surface);
    }
    textarea:focus { border-color: var(--blue); background: var(--white); }
    textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 42px; height: 42px; background: var(--blue); border: none; border-radius: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--blue-dark); transform: scale(1.04); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }
    .send-btn svg { width: 18px; height: 18px; fill: white; }

    .footer-note { text-align: center; font-size: 0.7rem; color: var(--muted); padding: 6px 0 2px; }
    .footer-note a { color: var(--blue); text-decoration: none; }

    @media (max-width: 600px) {
      .msg { max-width: 92%; }
      .header-logo { height: 36px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <img src="/logo.webp" alt="B-E-S-Team" class="header-logo" />
    <div class="header-info">
      <div class="header-title">B-E-S-Team AI Assistant</div>
      <div class="header-sub">Powered by Claude · Connected to GoHighLevel</div>
    </div>
    <div class="status-dot" title="Online"></div>
  </header>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <img src="/logo.webp" alt="B-E-S-Team" class="welcome-logo" />
      <h2>Welcome to B-E-S-Team AI</h2>
      <p>I can help you manage contacts, pipelines, appointments, and more — all directly inside GoHighLevel.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion('Show me my open opportunities')">Open opportunities</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Search for a contact')">Search contacts</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Show my pipelines')">View pipelines</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Book an appointment')">Book appointment</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Create a new contact')">New contact</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" placeholder="Ask me anything about your CRM..." rows="1"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="footer-note">B-E-S-Team · Increase Your Profit By Refining Your Processes</div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = window.__ENV?.SUPABASE_URL || '';
  const SUPABASE_ANON_KEY = window.__ENV?.SUPABASE_ANON_KEY || '';
  const API_BASE = '/api';

  // Session ID persisted in localStorage
  let sessionId = localStorage.getItem('best_session_id');
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem('best_session_id', sessionId);
  }

  let history = [];
  let isTyping = false;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const welcomeEl = document.getElementById('welcome');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Enter to send (Shift+Enter for newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Load history from Supabase on init
  async function loadHistory() {
    try {
      const res = await fetch(`${API_BASE}/history?sessionId=${sessionId}`);
      const data = await res.json();
      if (data.messages?.length) {
        welcomeEl.style.display = 'none';
        data.messages.forEach(m => appendMessage(m.role, m.content, false));
        history = data.messages.map(m => ({ role: m.role, content: m.content }));
        scrollToBottom();
      }
    } catch (e) { console.log('No history yet'); }
  }

  function appendMessage(role, content, animate = true) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const initial = role === 'assistant' ? 'AI' : 'You';
    div.innerHTML = `
      <div class="avatar">${initial}</div>
      <div class="bubble">${formatText(content)}</div>
    `;
    if (!animate) div.style.animation = 'none';
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function formatText(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/^- (.+)$/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
      .replace(/\n/g,'<br/>');
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = 'typing-indicator';
    div.innerHTML = `<div class="avatar">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    document.getElementById('typing-indicator')?.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  window.sendMessage = async function() {
    const text = inputEl.value.trim();
    if (!text || isTyping) return;

    welcomeEl.style.display = 'none';
    isTyping = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMessage('user', text);

    showTyping();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId, history })
      });
      const data = await res.json();
      removeTyping();

      const reply = data.reply || data.error || 'Sorry, something went wrong.';
      appendMessage('assistant', reply);

      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: reply });
      if (history.length > 40) history = history.slice(-40);

    } catch (err) {
      removeTyping();
      appendMessage('assistant', 'Connection error. Please try again.');
    }

    isTyping = false;
    sendBtn.disabled = false;
    inputEl.focus();
  };

  window.sendSuggestion = function(text) {
    inputEl.value = text;
    sendMessage();
  };

  loadHistory();
  inputEl.focus();
</script>
</body>
</html>
