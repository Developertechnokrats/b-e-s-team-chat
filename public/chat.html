<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>B-E-S-Team AI Chat</title>
  <link rel="icon" type="image/webp" href="/logo.webp"/>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--blue:#1B3A8C;--blue-dark:#122868;--red:#C8102E;--green:#2E7D32;--surface:#F4F6FB;--border:#DDE2EF;--text:#1A1A2E;--muted:#6B7280;--white:#fff;--sidebar:260px}
    html,body{height:100%;font-family:'Source Sans 3',sans-serif;background:var(--surface);color:var(--text)}
    .layout{display:flex;height:100vh;overflow:hidden}

    /* ── Sidebar ── */
    .sidebar{width:var(--sidebar);background:var(--blue);display:flex;flex-direction:column;flex-shrink:0}
    .sidebar-header{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,0.1)}
    .sidebar-logo{height:36px;filter:brightness(0) invert(1);margin-bottom:8px}
    .agent-info{display:flex;align-items:center;gap:8px;margin-top:8px}
    .agent-avatar{width:30px;height:30px;border-radius:8px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#fff;flex-shrink:0}
    .agent-name{font-size:0.82rem;color:rgba(255,255,255,0.9);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .agent-role{font-size:0.7rem;color:rgba(255,255,255,0.5)}

    /* Sub-account switcher */
    .sub-switcher{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.1)}
    .sub-switcher label{font-size:0.68rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
    .sub-select{width:100%;padding:7px 10px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-family:inherit;font-size:0.82rem;outline:none;cursor:pointer}
    .sub-select option{background:var(--blue-dark);color:#fff}

    .sessions-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
    .sessions-header span{font-size:0.7rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.5px}
    .new-chat-btn{width:24px;height:24px;background:rgba(255,255,255,0.15);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;transition:background .2s}
    .new-chat-btn:hover{background:rgba(255,255,255,0.25)}

    .sessions-list{flex:1;overflow-y:auto;padding:0 8px}
    .sessions-list::-webkit-scrollbar{width:3px}
    .sessions-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}
    .session-item{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:background .15s;display:flex;align-items:center;gap:8px}
    .session-item:hover{background:rgba(255,255,255,0.1)}
    .session-item.active{background:rgba(255,255,255,0.18)}
    .session-icon{font-size:0.85rem;opacity:.7}
    .session-title{font-size:0.82rem;color:rgba(255,255,255,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .session-date{font-size:0.68rem;color:rgba(255,255,255,0.4);flex-shrink:0}

    .sidebar-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.1)}
    .logout-btn{width:100%;padding:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:rgba(255,255,255,0.7);font-family:inherit;font-size:0.82rem;cursor:pointer;transition:all .2s}
    .logout-btn:hover{background:var(--red);border-color:var(--red);color:#fff}
    .admin-link{display:block;text-align:center;color:rgba(255,255,255,0.5);font-size:0.72rem;margin-bottom:6px;text-decoration:none}
    .admin-link:hover{color:#fff}

    /* ── Chat area ── */
    .chat{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .chat-header{background:var(--white);padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
    .chat-header-title{font-family:'Oswald',sans-serif;font-size:1rem;color:var(--blue);font-weight:600}
    .chat-header-sub{font-size:0.75rem;color:var(--muted)}
    .status-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;margin-left:auto}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(46,125,50,.3)}50%{box-shadow:0 0 0 5px rgba(46,125,50,.08)}}

    .messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
    .messages::-webkit-scrollbar{width:4px}
    .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    .msg{display:flex;gap:9px;max-width:80%;animation:fadeUp .22s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .msg.assistant{align-self:flex-start}
    .avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700}
    .msg.assistant .avatar{background:var(--blue);color:#fff}
    .msg.user .avatar{background:var(--red);color:#fff}
    .bubble{padding:10px 14px;border-radius:12px;font-size:0.88rem;line-height:1.6;word-break:break-word;white-space:pre-wrap}
    .msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:3px}
    .msg.user .bubble{background:var(--blue);color:#fff;border-top-right-radius:3px}

    .typing{display:flex;align-items:center;gap:4px;padding:11px 14px}
    .typing span{width:6px;height:6px;background:#93A3C8;border-radius:50%;animation:bounce 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}
    .typing span:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

    .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-state h3{font-family:'Oswald',sans-serif;color:var(--blue);font-size:1.2rem;margin-bottom:8px}
    .empty-state p{font-size:0.85rem;max-width:300px;margin:0 auto 16px;line-height:1.6}
    .suggestions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
    .sug-btn{padding:6px 12px;border-radius:16px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-size:0.8rem;cursor:pointer;transition:all .2s;font-family:inherit}
    .sug-btn:hover{background:var(--blue);color:#fff}

    .input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--white);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
    textarea{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:0.88rem;resize:none;line-height:1.5;max-height:110px;min-height:40px;outline:none;transition:border .2s;background:var(--surface);color:var(--text)}
    textarea:focus{border-color:var(--blue);background:#fff}
    textarea::placeholder{color:var(--muted)}
    .send-btn{width:40px;height:40px;background:var(--blue);border:none;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
    .send-btn:hover{background:var(--blue-dark);transform:scale(1.04)}
    .send-btn:disabled{background:var(--border);cursor:not-allowed;transform:none}
    .send-btn svg{width:17px;height:17px;fill:#fff}

    @media(max-width:640px){
      .sidebar{width:200px}
      .msg{max-width:90%}
    }
    @media(max-width:480px){
      .sidebar{display:none}
    }
  </style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="/logo.webp" class="sidebar-logo" alt="B-E-S-Team"/>
      <div class="agent-info">
        <div class="agent-avatar" id="agentInitial">?</div>
        <div>
          <div class="agent-name" id="agentName">Loading…</div>
          <div class="agent-role" id="agentRole">agent</div>
        </div>
      </div>
    </div>

    <div class="sub-switcher">
      <label>Working in</label>
      <select class="sub-select" id="subSelect" onchange="switchSubAccount()">
        <option value="">Select sub-account…</option>
      </select>
    </div>

    <div class="sessions-header">
      <span>Chats</span>
      <button class="new-chat-btn" onclick="newChat()" title="New chat">＋</button>
    </div>
    <div class="sessions-list" id="sessionsList"></div>

    <div class="sidebar-footer">
      <a href="/admin.html" class="admin-link" id="adminLink" style="display:none">⚙ Admin Panel</a>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat">
    <div class="chat-header">
      <div>
        <div class="chat-header-title" id="chatTitle">B-E-S-Team AI</div>
        <div class="chat-header-sub" id="chatSub">Select a sub-account to start</div>
      </div>
      <div class="status-dot"></div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <img src="/logo.webp" style="height:56px;margin-bottom:12px"/>
        <h3>Welcome back!</h3>
        <p>Select a sub-account from the sidebar, then start a new chat or pick an existing one.</p>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <div class="input-area">
      <textarea id="input" placeholder="Ask anything about your CRM…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>
</div>

<script>
let agent = null, token = null;
let currentSubAccount = null;
let currentSessionId = null;
let history = [];
let isTyping = false;

const $ = id => document.getElementById(id);

async function init() {
  token = localStorage.getItem('best_token');
  if (!token) return window.location.href = '/';

  // Verify token
  const res = await fetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'me', token }) });
  if (!res.ok) { localStorage.clear(); return window.location.href = '/'; }
  const data = await res.json();
  agent = data.agent;

  // Set UI
  $('agentName').textContent = agent.full_name;
  $('agentRole').textContent = agent.role;
  $('agentInitial').textContent = agent.full_name.charAt(0).toUpperCase();
  if (agent.role === 'admin') $('adminLink').style.display = 'block';

  // Populate sub-account dropdown
  const sel = $('subSelect');
  (agent.sub_accounts || []).forEach(sa => {
    const opt = document.createElement('option');
    opt.value = sa.id; opt.textContent = sa.name;
    sel.appendChild(opt);
  });

  // Auto-select if only one
  if (agent.sub_accounts?.length === 1) {
    sel.value = agent.sub_accounts[0].id;
    switchSubAccount();
  }

  // Suggestions
  const sugs = ['Show open opportunities','Search for a contact','View my pipelines','Create a new contact','Book an appointment'];
  $('suggestions').innerHTML = sugs.map(s => `<button class="sug-btn" onclick="useSuggestion('${s}')">${s}</button>`).join('');
}

async function switchSubAccount() {
  const sel = $('subSelect');
  const id = sel.value;
  if (!id) return;
  currentSubAccount = agent.sub_accounts.find(s => s.id === id);
  currentSessionId = null;
  history = [];
  $('chatTitle').textContent = currentSubAccount.name;
  $('chatSub').textContent = 'AI Assistant · Connected to GHL';
  $('messages').innerHTML = '<div class="empty-state"><h3>Ready!</h3><p>Start a new chat or select one from the sidebar.</p></div>';
  await loadSessions();
}

async function loadSessions() {
  if (!currentSubAccount) return;
  const res = await fetch(`/api/chat/sessions?subAccountId=${currentSubAccount.id}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const data = await res.json();
  const list = $('sessionsList');
  list.innerHTML = '';
  (data.sessions || []).forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
    div.innerHTML = `<span class="session-icon">💬</span><span class="session-title">${escHtml(s.title)}</span><span class="session-date">${formatDate(s.last_active)}</span>`;
    div.onclick = () => loadSession(s.id, s.title);
    list.appendChild(div);
  });
}

async function loadSession(sessionId, title) {
  currentSessionId = sessionId;
  history = [];
  $('messages').innerHTML = '';
  $('chatSub').textContent = title;

  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.querySelector('.session-title')?.textContent === title);
  });

  const res = await fetch(`/api/chat/history?sessionId=${sessionId}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const data = await res.json();
  (data.messages || []).forEach(m => appendMessage(m.role, m.content, false));
  history = (data.messages || []).map(m => ({ role: m.role, content: m.content }));
  scrollBottom();
}

async function newChat() {
  if (!currentSubAccount) return alert('Please select a sub-account first.');
  const res = await fetch('/api/chat/session', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify({ subAccountId: currentSubAccount.id, title: 'New Chat' })
  });
  const data = await res.json();
  if (data.session) {
    await loadSessions();
    await loadSession(data.session.id, 'New Chat');
    $('input').focus();
  }
}

async function sendMessage() {
  const text = $('input').value.trim();
  if (!text || isTyping) return;
  if (!currentSessionId) return alert('Start a new chat first (click ＋)');

  isTyping = true; $('sendBtn').disabled = true;
  $('input').value = ''; $('input').style.height = 'auto';
  $('emptyState') && ($('emptyState').style.display = 'none');

  appendMessage('user', text);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ message: text, sessionId: currentSessionId, history })
    });
    const data = await res.json();
    removeTyping();
    const reply = data.reply || data.error || 'Something went wrong.';
    appendMessage('assistant', reply);
    history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
    if (history.length > 40) history = history.slice(-40);
    loadSessions(); // refresh titles
  } catch(e) {
    removeTyping(); appendMessage('assistant', 'Connection error. Please retry.');
  }
  isTyping = false; $('sendBtn').disabled = false; $('input').focus();
}

function appendMessage(role, content, animate=true) {
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  if (!animate) d.style.animation = 'none';
  const init = role === 'assistant' ? 'AI' : (agent?.full_name?.charAt(0) || 'Y');
  d.innerHTML = `<div class="avatar">${init}</div><div class="bubble">${fmt(content)}</div>`;
  $('messages').appendChild(d);
  scrollBottom();
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'msg assistant'; d.id = 'typing';
  d.innerHTML = `<div class="avatar">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  $('messages').appendChild(d); scrollBottom();
}
function removeTyping() { $('typing')?.remove(); }
function scrollBottom() { const m = $('messages'); m.scrollTop = m.scrollHeight; }

function fmt(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^- (.+)$/gm,'• $1').replace(/\n/g,'<br/>');
}
function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatDate(d) { if(!d) return ''; const dt = new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function useSuggestion(t) { $('input').value = t; sendMessage(); }
function logout() { localStorage.clear(); window.location.href = '/'; }

$('input').addEventListener('input', () => {
  $('input').style.height = 'auto';
  $('input').style.height = Math.min($('input').scrollHeight, 110) + 'px';
});
$('input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }});

init();
</script>
</body>
</html>
